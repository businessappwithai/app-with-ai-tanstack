# GitHubNeon — generate an application from an online ERD and run it against Neon
#
# Takes a URL to an online .mmd (Mermaid ERD / EML) model and a Neon PostgreSQL
# connection string, then on a GitHub-hosted runner with Bun as the runtime:
#
#   1. runs the generator over the model                → a full TanStack Start + NestJS app
#   2. points the generated backend at Neon             → backend/.env
#   3. migrates and seeds the Neon database             → schema + dictionary + sample data
#   4. verifies what landed in Neon                     → table/row report, fails if empty
#   5. starts backend and frontend on the runner        → the app running against Neon
#   6. exercises the running app                        → generated bun:test E2E suites
#   7. optionally publishes the generated app to a repo → a durable deployment artifact
#
# ── The Neon connection string ────────────────────────────────────────────────
# Preferred: store it as the repository secret NEON_DATABASE_URL and leave the
# `database_url` input empty. The input exists for one-off runs against another
# branch, but note that workflow_dispatch inputs are recorded in the run's
# metadata and visible to anyone who can read the run — a secret is not. The
# value is masked in the logs either way.
#
# `?sslmode=require` is appended automatically when the URL does not carry it;
# Neon refuses plaintext connections and the pg driver only negotiates TLS when
# the connection string asks it to.
#
# ── Secrets ───────────────────────────────────────────────────────────────────
#   NEON_DATABASE_URL   Neon PostgreSQL connection string (recommended).
#   EML_PUBLISH_TOKEN   Only needed when `publish_repo` is set. A PAT with
#                       `repo` **and** `workflow` scopes — the generated app
#                       carries its own .github/workflows/, and GitHub rejects a
#                       push containing those without the workflow scope.
name: GitHubNeon

on:
  workflow_dispatch:
    inputs:
      mmd_url:
        description: "URL of the online .mmd ERD / EML model to generate from"
        required: true
      app_name:
        description: "Name for the generated application"
        required: false
        default: "neon-app"
      database_url:
        description: "Neon connection string (leave empty to use the NEON_DATABASE_URL secret)"
        required: false
        default: ""
      reset_schema:
        description: "Drop and recreate the public schema before migrating (destructive)"
        type: boolean
        default: false
      run_e2e:
        description: "How much of the generated E2E suite to run against the live app"
        type: choice
        options:
          - smoke
          - fast
          - full
          - none
        # smoke is the default because it is the part that is green today.
        # `fast` and `full` also run 08-users-roles, which asserts that public
        # sign-up succeeds while the generated backend sets disableSignUp: true
        # on purpose ("no self-service accounts"). That suite therefore fails
        # for every app this generator emits, on any database — reconcile the
        # template with the suite before relying on those modes.
        default: smoke
      run_frontend:
        description: "Also start the generated frontend and check that it serves"
        type: boolean
        default: true
      publish_repo:
        description: "Optional target repository (owner/repo) to publish the generated app to"
        required: false
        default: ""
      publish_visibility:
        description: "Visibility used when the target repository has to be created"
        type: choice
        options:
          - private
          - public
        default: private


permissions:
  contents: read

# Runs share one Neon database, so let them queue rather than migrate and seed
# on top of each other.
concurrency:
  group: githubneon
  cancel-in-progress: false

jobs:
  generate-deploy-run:
    name: Generate, seed Neon, and run
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      APP_DIR: generated-app
      BACKEND_PORT: "4001"
      FRONTEND_PORT: "4000"
      APP_ADMIN_EMAIL: admin@admin.com
      APP_ADMIN_PASSWORD: admin

      # Each setting is resolved once here, so no step below has to know which
      # event started the run. On a push (the temporary self-test above) the
      # inputs are empty, so each falls back to a value that exercises the
      # workflow against the drug-discovery model.
      MMD_URL: ${{ github.event_name == 'push' && 'https://raw.githubusercontent.com/businessappwithai/app-with-ai-tanstack/claude/github-neon-deployment-action-rf6oir/examples/drug-discovery.eml.mmd' || inputs.mmd_url }}
      APP_NAME: ${{ github.event_name == 'push' && 'drug-discovery' || inputs.app_name }}
      # Deliberately false for the self-test: the migrations are idempotent, so
      # a push run proves the path without dropping a schema on a database that
      # is not this workflow's to destroy.
      RESET_SCHEMA: ${{ github.event_name == 'push' && 'false' || inputs.reset_schema }}
      RUN_E2E: ${{ github.event_name == 'push' && 'smoke' || inputs.run_e2e }}
      RUN_FRONTEND: ${{ github.event_name == 'push' && 'true' || inputs.run_frontend }}
      PUBLISH_REPO: ${{ inputs.publish_repo }}
      PUBLISH_VISIBILITY: ${{ inputs.publish_visibility }}

    steps:
      - name: Checkout the generator
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ── Inputs ──────────────────────────────────────────────────────────────
      # Every input is read through the environment rather than interpolated
      # into the script body, so a value containing shell metacharacters is
      # data and not code.

      - name: Validate the inputs
        run: |
          set -euo pipefail

          case "$MMD_URL" in
            http://*|https://*) ;;
            *) echo "::error::mmd_url must be an http(s) URL, got '$MMD_URL'"; exit 1 ;;
          esac

          if ! printf '%s' "$APP_NAME" | grep -Eq '^[A-Za-z][A-Za-z0-9 _-]{0,48}$'; then
            echo "::error::app_name must start with a letter and use only letters, digits, spaces, '-' or '_'"
            exit 1
          fi

          if [ -n "$PUBLISH_REPO" ] && ! printf '%s' "$PUBLISH_REPO" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "::error::publish_repo must be in owner/repo form"
            exit 1
          fi

      - name: Resolve the Neon connection string
        env:
          INPUT_DATABASE_URL: ${{ inputs.database_url }}
          SECRET_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail

          URL="${INPUT_DATABASE_URL:-$SECRET_DATABASE_URL}"
          if [ -z "$URL" ]; then
            echo "::error::No Neon connection string. Set the NEON_DATABASE_URL secret or pass the database_url input."
            exit 1
          fi

          # Mask before anything else can echo it, and mask the password on its
          # own too, so a driver error quoting only the credential stays covered.
          echo "::add-mask::$URL"
          PASSWORD="$(printf '%s' "$URL" | sed -n 's#^[a-zA-Z+]*://[^:/@]*:\([^@]*\)@.*#\1#p')"
          if [ -n "$PASSWORD" ]; then echo "::add-mask::$PASSWORD"; fi

          echo "DATABASE_URL=$URL" >> "$GITHUB_ENV"

          if [ -n "$INPUT_DATABASE_URL" ]; then
            echo "::warning::database_url was supplied as a workflow input — it is masked in the logs but visible in the run's inputs. Prefer the NEON_DATABASE_URL secret."
          fi

      # ── Generator ───────────────────────────────────────────────────────────

      - name: Install generator dependencies
        run: bun install

      - name: Build @appwithai/core
        run: bun run build:core

      - name: Download the model
        run: |
          set -euo pipefail
          echo "Downloading $MMD_URL"
          curl -fSL --retry 3 --retry-delay 2 --max-time 120 --max-filesize 10000000 \
            "$MMD_URL" -o model.mmd
          echo "----- model.mmd (first 40 lines) -----"
          head -n 40 model.mmd

      - name: Validate the model
        run: bun packages/generator/src/cli/generate.ts validate model.mmd

      - name: Check that Neon is reachable
        run: bun scripts/ci/neon-db.ts check

      - name: Generate the application
        run: |
          set -euo pipefail
          # --no-setup: install/migrate/seed are driven below instead, because
          # they have to run *after* backend/.env points at Neon — the generated
          # migrate.ts and seed.ts read that file with dotenv override, so the
          # default localhost .env would otherwise win.
          bun packages/generator/src/cli/generate.ts generate \
            --input model.mmd \
            --output "$APP_DIR" \
            --name "$APP_NAME" \
            --description "Generated by GitHubNeon from an online model" \
            --stack tanstackjs-nestjs \
            --db postgresql \
            --port "$BACKEND_PORT" \
            --frontend-port "$FRONTEND_PORT" \
            --api-url "http://localhost:$BACKEND_PORT" \
            --cors-origin "http://localhost:$FRONTEND_PORT" \
            --package-manager bun \
            --force \
            --no-setup

      # ── Neon: point the app at it, migrate, seed, verify ────────────────────

      - name: Point the generated backend at Neon
        env:
          APP_BACKEND_PORT: ${{ env.BACKEND_PORT }}
          APP_FRONTEND_PORT: ${{ env.FRONTEND_PORT }}
        run: bun scripts/ci/neon-db.ts write-env "$APP_DIR/backend/.env"

      - name: Install the generated application's dependencies
        working-directory: ${{ env.APP_DIR }}
        run: bun install

      - name: Generate the frontend route tree
        working-directory: ${{ env.APP_DIR }}/frontend
        run: |
          # Every route file imports ids from src/routeTree.gen.ts, which the
          # Vite plugin only writes on the first dev/build. Non-fatal: the dev
          # server writes it too, just later.
          bun run routes:generate || echo "::warning::routes:generate failed — the dev server will write routeTree.gen.ts"

      - name: Reset the Neon schema
        if: ${{ env.RESET_SCHEMA == 'true' }}
        run: bun scripts/ci/neon-db.ts reset

      - name: Migrate Neon
        working-directory: ${{ env.APP_DIR }}/backend
        run: bun run migrate

      - name: Seed Neon
        working-directory: ${{ env.APP_DIR }}/backend
        # `migrate` already runs the seeds once it has applied the schema. This
        # runs them again as a separate, visible step so a seeding failure is
        # reported as one; the seeds are idempotent (verified: a second run
        # leaves row counts unchanged), so it costs a no-op pass.
        run: bun run seed

      - name: Verify what landed in Neon
        run: bun scripts/ci/neon-db.ts report --assert

      # ── Run the application against Neon ─────────────────────────────────────

      - name: Start the backend
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/run-logs"

          cd "$APP_DIR/backend"
          # backend/.env supplies DATABASE_URL, and Bun loads it from the cwd —
          # better-auth reads it before Nest's ConfigModule is even constructed.
          bun run start > "$GITHUB_WORKSPACE/run-logs/backend.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/run-logs/backend.pid"

          echo "Waiting for the backend on :$BACKEND_PORT …"
          for attempt in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:$BACKEND_PORT/api/me/health" -o /dev/null; then
              echo "✓ Backend healthy after ${attempt}s"
              curl -sS "http://127.0.0.1:$BACKEND_PORT/api/me/health"
              echo
              exit 0
            fi
            if ! kill -0 "$(cat "$GITHUB_WORKSPACE/run-logs/backend.pid")" 2>/dev/null; then
              echo "::error::The backend exited before becoming healthy."
              tail -n 200 "$GITHUB_WORKSPACE/run-logs/backend.log"
              exit 1
            fi
            sleep 1
          done

          echo "::error::The backend did not become healthy within 90s."
          tail -n 200 "$GITHUB_WORKSPACE/run-logs/backend.log"
          exit 1

      - name: Check the running app reads from Neon
        run: |
          set -euo pipefail
          BASE="http://127.0.0.1:$BACKEND_PORT/api"

          # A protected route must reject an anonymous caller — proof that auth
          # is wired, not that the process merely listens.
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' "$BASE/me")"
          case "$STATUS" in
            401|403) echo "✓ /api/me rejects anonymous callers ($STATUS)" ;;
            *) echo "::error::/api/me returned $STATUS, expected 401 or 403"; exit 1 ;;
          esac

          # Sign in as the administrator the seed created in Neon. A 200 here
          # means the running app authenticated a row it read out of Neon.
          LOGIN_STATUS="$(curl -s -o /tmp/login.json -w '%{http_code}' \
            -X POST "$BASE/auth/sign-in/email" \
            -H 'Content-Type: application/json' \
            -H "Origin: http://localhost:$FRONTEND_PORT" \
            -c /tmp/cookies.txt \
            -d "{\"email\":\"$APP_ADMIN_EMAIL\",\"password\":\"$APP_ADMIN_PASSWORD\"}")"
          if [ "$LOGIN_STATUS" != "200" ]; then
            echo "::error::Signing in as $APP_ADMIN_EMAIL returned $LOGIN_STATUS"
            cat /tmp/login.json || true
            tail -n 100 "$GITHUB_WORKSPACE/run-logs/backend.log"
            exit 1
          fi
          echo "✓ Signed in as the seeded administrator"

          ME_STATUS="$(curl -s -o /tmp/me.json -w '%{http_code}' \
            -b /tmp/cookies.txt \
            -H "Origin: http://localhost:$FRONTEND_PORT" \
            "$BASE/me")"
          if [ "$ME_STATUS" != "200" ]; then
            echo "::error::/api/me returned $ME_STATUS for the signed-in administrator"
            cat /tmp/me.json || true
            exit 1
          fi
          echo "✓ /api/me served the session from Neon"

      - name: Start the frontend
        if: ${{ env.RUN_FRONTEND == 'true' }}
        run: |
          set -euo pipefail
          cd "$APP_DIR/frontend"
          bun run dev > "$GITHUB_WORKSPACE/run-logs/frontend.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/run-logs/frontend.pid"

          echo "Waiting for the frontend on :$FRONTEND_PORT …"
          for attempt in $(seq 1 180); do
            # -L because / answers 307 → /dashboard, and a bare 307 with an
            # empty body would otherwise "succeed" while proving nothing.
            SIZE="$(curl -fsSL "http://127.0.0.1:$FRONTEND_PORT/" -o /dev/null -w '%{size_download}' 2>/dev/null || echo 0)"
            if [ "${SIZE:-0}" -gt 0 ]; then
              echo "✓ Frontend served ${SIZE} bytes after ${attempt}s"

              # The dev server proxies /api to the backend. Exercising it here
              # proves the browser-facing path to the database, not just that
              # two processes happen to be listening.
              if curl -fsS "http://127.0.0.1:$FRONTEND_PORT/api/me/health" | grep -q '"status"'; then
                echo "✓ Frontend proxies /api through to the backend"
                exit 0
              fi
              echo "::error::The frontend is serving but /api does not reach the backend."
              tail -n 100 "$GITHUB_WORKSPACE/run-logs/frontend.log"
              exit 1
            fi
            if ! kill -0 "$(cat "$GITHUB_WORKSPACE/run-logs/frontend.pid")" 2>/dev/null; then
              echo "::error::The frontend exited before serving."
              tail -n 200 "$GITHUB_WORKSPACE/run-logs/frontend.log"
              exit 1
            fi
            sleep 1
          done

          echo "::error::The frontend did not serve within 180s."
          tail -n 200 "$GITHUB_WORKSPACE/run-logs/frontend.log"
          exit 1

      - name: Exercise the running app
        if: ${{ env.RUN_E2E != 'none' }}
        working-directory: ${{ env.APP_DIR }}/tests
        env:
          E2E_BASE_URL: http://127.0.0.1:${{ env.BACKEND_PORT }}
          E2E_ORIGIN: http://localhost:${{ env.FRONTEND_PORT }}
          E2E_ADMIN_EMAIL: ${{ env.APP_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ env.APP_ADMIN_PASSWORD }}
          E2E_MODE: ${{ env.RUN_E2E }}
        run: |
          set -euo pipefail
          # --no-server: attach to the backend already running against Neon
          # rather than letting the runner start a second one.
          case "$E2E_MODE" in
            smoke) bun run run.ts --no-server --only health ;;
            fast)  bun run run.ts --no-server --fast --small ;;
            full)  bun run run.ts --no-server --full ;;
            *) echo "::error::Unknown run_e2e value '$E2E_MODE'"; exit 1 ;;
          esac

      # ── Publish (optional) ──────────────────────────────────────────────────

      - name: Publish the generated application
        if: ${{ env.PUBLISH_REPO != '' }}
        env:
          PUBLISH_TOKEN: ${{ secrets.EML_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::publish_repo was set but the EML_PUBLISH_TOKEN secret is missing (needs 'repo' and 'workflow' scopes)."
            exit 1
          fi
          echo "::add-mask::$PUBLISH_TOKEN"

          OWNER="${PUBLISH_REPO%%/*}"
          REPO="${PUBLISH_REPO##*/}"
          API="https://api.github.com"
          AUTH_HEADER="Authorization: Bearer $PUBLISH_TOKEN"

          # Create the repository when it does not exist yet.
          EXISTS="$(curl -s -o /dev/null -w '%{http_code}' -H "$AUTH_HEADER" "$API/repos/$OWNER/$REPO")"
          if [ "$EXISTS" = "404" ]; then
            PRIVATE=true
            [ "$PUBLISH_VISIBILITY" = "public" ] && PRIVATE=false

            VIEWER="$(curl -s -H "$AUTH_HEADER" "$API/user" | jq -r '.login')"
            if [ "$VIEWER" = "$OWNER" ]; then
              CREATE_URL="$API/user/repos"
            else
              CREATE_URL="$API/orgs/$OWNER/repos"
            fi

            echo "Creating $OWNER/$REPO ($PUBLISH_VISIBILITY)…"
            CREATED="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "$AUTH_HEADER" \
              -H 'Accept: application/vnd.github+json' "$CREATE_URL" \
              -d "{\"name\":\"$REPO\",\"private\":$PRIVATE,\"description\":\"Generated by GitHubNeon\"}")"
            if [ "$CREATED" != "201" ]; then
              echo "::error::Could not create $OWNER/$REPO (HTTP $CREATED). Check the token's scopes."
              exit 1
            fi
          elif [ "$EXISTS" != "200" ]; then
            echo "::error::Could not read $OWNER/$REPO (HTTP $EXISTS). Check the token's scopes."
            exit 1
          fi

          cd "$APP_DIR"
          # The generated .gitignore already excludes .env; remove it outright so
          # the Neon connection string cannot reach the published repository even
          # if that file is ever changed.
          rm -f backend/.env frontend/.env

          rm -rf .git
          git init -q
          git checkout -q -b main
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Generated from $MMD_URL" -m "Produced by the GitHubNeon workflow."

          git remote add origin "https://x-access-token:$PUBLISH_TOKEN@github.com/$OWNER/$REPO.git"
          for delay in 2 4 8 16; do
            if git push -f -u origin main; then
              echo "✓ Published to https://github.com/$OWNER/$REPO"
              exit 0
            fi
            echo "Push failed — retrying in ${delay}s…"
            sleep "$delay"
          done
          git push -f -u origin main

      # ── Teardown and evidence ───────────────────────────────────────────────

      - name: Stop the application
        if: always()
        run: |
          for name in backend frontend; do
            PID_FILE="$GITHUB_WORKSPACE/run-logs/$name.pid"
            if [ -f "$PID_FILE" ]; then
              PID="$(cat "$PID_FILE")"
              kill "$PID" 2>/dev/null || true
              # Bun spawns the server in a process group; sweep any children.
              pkill -P "$PID" 2>/dev/null || true
            fi
          done
          # Nothing here should fail the run.
          exit 0

      - name: Collect the application logs
        if: always()
        run: |
          for name in backend frontend; do
            LOG="$GITHUB_WORKSPACE/run-logs/$name.log"
            [ -f "$LOG" ] || continue
            echo "::group::$name.log (last 200 lines)"
            tail -n 200 "$LOG"
            echo "::endgroup::"
          done
          exit 0

      - name: Package the generated application
        if: always()
        run: |
          set -euo pipefail
          [ -d "$APP_DIR" ] || exit 0
          tar --exclude='node_modules' \
              --exclude='dist' \
              --exclude='.git' \
              --exclude='.env' \
              --exclude='.env.local' \
              --exclude='.output' \
              --exclude='.vinxi' \
              -czf generated-app.tar.gz "$APP_DIR"

      - name: Upload the generated application and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: githubneon-${{ github.run_id }}
          path: |
            generated-app.tar.gz
            run-logs/*.log
            model.mmd
          if-no-files-found: warn
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "### GitHubNeon"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Model | \`$MMD_URL\` |"
            echo "| Application | \`$APP_NAME\` |"
            echo "| Database | Neon PostgreSQL (connection string masked) |"
            echo "| Schema reset | $RESET_SCHEMA |"
            echo "| E2E | $RUN_E2E |"
            echo "| Frontend started | $RUN_FRONTEND |"
            if [ -n "$PUBLISH_REPO" ]; then
              echo "| Published to | [\`$PUBLISH_REPO\`](https://github.com/$PUBLISH_REPO) |"
            fi
            echo
            echo "Backend ran on \`:$BACKEND_PORT\`, frontend on \`:$FRONTEND_PORT\`, both against Neon."
          } >> "$GITHUB_STEP_SUMMARY"
