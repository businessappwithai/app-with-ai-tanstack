# CI — check the generator, and check what it generates.
#
# The second half is the point. Type-checking this repository says nothing about
# whether a generated application compiles, because the templates are `.hbs`
# text until something renders them. Two bugs reached main that way: an admin
# endpoint that could never create a user, and three type errors that stopped
# every generated backend building. Both were invisible to `tsc` here and would
# have been caught by generating one application and building it.
#
# So that is what the second job does — generate, build both halves, run the
# suite the generator emits against a real database.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pinned, not `latest`. Three of the checks below compare a committed bundle
# against a fresh build of it, byte for byte, and Bun's bundler is free to
# change its output between releases — 1.4.0 did, and turned every open pull
# request red for a reason none of them had anything to do with. Moving this
# forward is a deliberate step: bump it, run the four build scripts, and commit
# the bundles they rewrite in the same change.
env:
  BUN_VERSION: "1.4.0"

# A newer push makes an in-flight run redundant, except on main, where each
# commit's result is worth keeping.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Type-check, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run type-check

      # Error-level only. The tree carries several hundred style warnings that
      # predate this workflow; failing on those would mean the first red build
      # is noise nobody reads. Errors — formatting and unorganised imports — are
      # auto-fixable with `bun run lint:fix` and stay enforced.
      - name: Lint
        run: bunx biome check . --max-diagnostics=2000 --diagnostic-level=error

      - name: Unit tests
        run: bun run test

      # The browser stack ships its runtime twice: as editable files under
      # templates/wasm, and as the inlined module the generator (and the hosted
      # page) actually reads. A stale copy generates applications from
      # yesterday's runtime while the diff shows today's, which is exactly the
      # kind of drift nobody notices until an app misbehaves in a way the source
      # cannot explain.
      - name: The inlined wasm runtime is current
        run: bun run build:wasm-runtime -- --check

      - name: The full-stack browser bundle is current
        run: bun run build:fullstack-browser --check

      - name: The browser bundle of the generator is current
        run: bun run build:wasm-browser -- --check

      # checker.js and fixer.js are the published validation surface: llms-full.txt
      # tells a model to run its output past them before handing it to anyone. A
      # stale or broken copy passes a document the CLI would refuse, which is the
      # one failure that discredits the whole loop.
      - name: The published checker and fixer are current
        run: bun run build:language-tools --check

      # --check proves they are not stale, not that they run. They are bundled
      # against Node stubs, and a stub that throws turns every check into an
      # exception the page reports as an invalid model.
      - name: The published checker and fixer agree with the CLI
        run: bun run test:language-tools

  generated-wasm-app:
    name: Generate a browser application and run its backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # No database service. That is the point of this job: the application it
    # generates carries its own Postgres, compiled to WebAssembly, and the
    # backend it starts is the same code a browser tab runs. If this passes on a
    # runner with no Postgres installed, the claim holds.
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: bun install --frozen-lockfile

      # The overlay's whole claim is that it is not a second stack. Generating
      # both ways and diffing is what keeps that true: if the difference grows
      # past the driver, the scripts and the audit ledger, this fails.
      - name: Generate the stack twice — with and without the overlay
        run: |
          # Same name and description to both, so the comparison below is about
          # the overlay rather than about two CLIs' defaults.
          bun packages/generator/src/cli/generate.ts generate \
            -i language/examples/crm.eml.mmd -o plain-app \
            --name "CI CRM" -d "CI CRM" --force --no-setup
          bun run wasm generate \
            -i language/examples/crm.eml.mmd -o wasm-app \
            --name "CI CRM" -d "CI CRM" --force

      - name: The overlay changed only what it is allowed to change
        run: |
          # Generated files carry the moment they were generated, in several
          # comment styles, so every ISO timestamp is blanked before comparing
          # rather than one comment prefix being stripped. Anything still
          # differing is the overlay's doing and has to be on the list.
          strip() { sed -E 's/[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z//g' "$1"; }
          changed=$(cd plain-app && find . -type f -not -path "./pgdata/*" | while read -r f; do
            if [ -f "../wasm-app/$f" ] && ! diff -q \
              <(sed -E 's/[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z//g' "$f") \
              <(sed -E 's/[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z//g' "../wasm-app/$f") \
              > /dev/null 2>&1; then
              echo "$f"
            fi
          done | sort)
          echo "Changed by the overlay:"; echo "$changed"
          expected=$(printf '%s\n' ./.appwithai.json ./backend/.env ./backend/.env.example \
            ./backend/package.json ./backend/run-app.sh \
            ./backend/src/modules/audit/immudb.service.ts ./docker-start.sh \
            ./frontend/package.json ./package.json | sort)
          if [ "$changed" != "$expected" ]; then
            echo "::error::The overlay's footprint changed. Expected:"; echo "$expected"
            exit 1
          fi

      # The application — backend and front end. `tests/` is deliberately not in
      # this list: the generated E2E suite is written against `bun:test`, and
      # porting it would mean rewriting the suite rather than overlaying the
      # application.
      # `tests/` is in this list now. It used to be excluded because the
      # generated E2E suite was written against `bun:test`; it is `node:test`
      # now, so a wasm application has no Bun in it anywhere.
      - name: No Bun left in the generated application
        run: |
          if grep -rn '"[^"]*\bbunx\?\b[^"]*"' wasm-app/package.json \
               wasm-app/backend/package.json wasm-app/frontend/package.json \
               wasm-app/tests/package.json; then
            echo "::error::A generated script still calls bun"; exit 1
          fi

      # Type-checked as well as loaded: the `bun:test` port's failures were all
      # type errors that Node happily ran anyway — a timeout silently dropped,
      # an `it.skipIf` that is not there until it is called.
      - name: The generated test suite type-checks and runs on Node
        run: |
          cd wasm-app/tests
          npm install --no-audit --no-fund
          npx tsc --noEmit
          node --input-type=module -e '
            await import("./harness/testing.ts");
            await import("./harness/index.ts");
            console.log("the generated suite loads under Node");
          '


      - name: Install, migrate and seed on WebAssembly Postgres
        run: |
          # From the workspace root, then from the backend — the same two
          # commands the README tells a reader to run, rather than a `--prefix`
          # spelling of them that resolves workspaces differently.
          cd wasm-app && npm install
          cd backend && npm run db:setup

      - name: Start the NestJS backend and exercise it
        working-directory: wasm-app/backend
        run: |
          npm run start > backend.log 2>&1 &
          # An unauthenticated /bus answers 401 once the server is up, which is
          # a better readiness signal than a log line: it proves the routes are
          # mapped, not just that a process printed something.
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4001/api/bus/account || true)
            [ "$code" = "401" ] && break
            sleep 2
          done
          tail -30 backend.log
          bun "$GITHUB_WORKSPACE/scripts/ci/wasm-smoke.ts" --base http://localhost:4001/api --stack nestjs

      - name: Show the backend log on failure
        if: failure()
        run: cat wasm-app/backend/backend.log || true

  wasm-e2e:
    name: Drive the browser stack in Chromium
    runs-on: ubuntu-latest
    # Everything else about this stack is checked by generating it and reading
    # what came out. This is the only job that opens the result: the Service
    # Worker, the Node-API shim, the worker host and the interface are browser
    # behaviours, and every bug in them was found by looking rather than by
    # diffing.
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # Seventeen megabytes of PostgreSQL, placed beside the page so the run
      # does not depend on a CDN being up.
      - name: Vendor PGlite
        run: bun run vendor:pglite

      # run-real-stack.html assembles the NestJS stack in the tab, which needs
      # the templates beside the page. They are a copy of files already in this
      # repository, so they are generated rather than committed.
      - name: Put the stack templates beside the page
        run: bun run build:stack-templates

      - name: Generate, boot and use an application in a browser
        run: bun run test:wasm

      - name: Keep what the run saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-e2e
          path: |
            pics/wasm-e2e/
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  generated-app:
    name: Generate an application and build it
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        # pgvector rather than stock Postgres: the model-context assistant
        # stores embeddings, and `CREATE EXTENSION vector` fails without it.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: generated
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_DIR: generated-app
      BACKEND_PORT: "4601"
      FRONTEND_PORT: "4600"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build the packages the generator needs
        run: |
          bun run build:core
          bun run build:generator

      - name: Generate an application
        # 25 records per entity rather than the default 1000: this job is here
        # to prove the generated application compiles and behaves, not to
        # measure it under load. The benchmark suite still runs, against a
        # smaller table.
        run: |
          bun packages/generator/src/cli/generate.ts generate \
            --input examples/drug-discovery.eml.mmd \
            --output "$APP_DIR" \
            --name ci-generated \
            --port "$BACKEND_PORT" \
            --frontend-port "$FRONTEND_PORT" \
            --records-per-entity 25 \
            --force \
            --no-setup

      - name: Install the generated application
        working-directory: ${{ env.APP_DIR }}
        run: bun install

      # The three builds below are the checks that were missing. Each one fails
      # on a template that renders code which does not compile.

      - name: Build the generated backend
        working-directory: ${{ env.APP_DIR }}/backend
        run: bun run build

      - name: Build the generated frontend
        working-directory: ${{ env.APP_DIR }}/frontend
        run: bun run build

      - name: Type-check the generated test suite
        working-directory: ${{ env.APP_DIR }}/tests
        run: bunx tsc --noEmit

      - name: Point the generated backend at Postgres
        run: |
          cat > "$APP_DIR/backend/.env" <<EOF
          PORT=$BACKEND_PORT
          HOST=127.0.0.1
          NODE_ENV=development
          DATABASE_URL=postgresql://app:app@127.0.0.1:5432/generated
          CORS_ORIGIN=http://localhost:$FRONTEND_PORT
          BETTER_AUTH_URL=http://localhost:$BACKEND_PORT
          BETTER_AUTH_SECRET=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
          ADMIN_EMAIL=admin@admin.com
          ADMIN_PASSWORD=admin
          THROTTLE_TTL=60000
          THROTTLE_LIMIT=1000000
          IMMUDB_ENABLED=false
          EOF

      - name: Migrate and seed
        working-directory: ${{ env.APP_DIR }}/backend
        run: bun run migrate

      - name: Start the generated backend
        working-directory: ${{ env.APP_DIR }}/backend
        run: |
          mkdir -p "$GITHUB_WORKSPACE/run-logs"
          bun run start > "$GITHUB_WORKSPACE/run-logs/backend.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/run-logs/backend.pid"

          for attempt in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:$BACKEND_PORT/api/me/health" -o /dev/null; then
              echo "✓ healthy after ${attempt}s"
              exit 0
            fi
            if ! kill -0 "$(cat "$GITHUB_WORKSPACE/run-logs/backend.pid")" 2>/dev/null; then
              echo "::error::The generated backend exited before becoming healthy."
              tail -n 200 "$GITHUB_WORKSPACE/run-logs/backend.log"
              exit 1
            fi
            sleep 1
          done
          echo "::error::The generated backend did not become healthy within 90s."
          tail -n 200 "$GITHUB_WORKSPACE/run-logs/backend.log"
          exit 1

      - name: Run the generated E2E suite
        working-directory: ${{ env.APP_DIR }}/tests
        env:
          E2E_BASE_URL: http://127.0.0.1:${{ env.BACKEND_PORT }}
          E2E_ORIGIN: http://localhost:${{ env.FRONTEND_PORT }}
        run: bun test --timeout 180000

      - name: The application's own logs, whatever happened
        if: always()
        run: |
          LOG="$GITHUB_WORKSPACE/run-logs/backend.log"
          [ -f "$LOG" ] || exit 0
          echo "::group::backend.log (last 200 lines)"
          tail -n 200 "$LOG"
          echo "::endgroup::"
