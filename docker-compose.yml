# The generator, with a database.
#
#   docker compose up --build                 local Postgres, empty workspace
#   SEED_MODEL=/models/drug-discovery.eml.mmd docker compose up --build
#
# To use a hosted database instead of the bundled one — Neon, Supabase, RDS —
# set DATABASE_URL and leave the postgres service out:
#
#   DATABASE_URL='postgresql://…@….neon.tech/db?sslmode=require' \
#     docker compose up generator
#
# The `postgres` service is in a profile precisely so that works: it starts by
# default, but naming the generator alone skips it.

services:
  postgres:
    image: pgvector/pgvector:pg18
    profiles: ["", "local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-erdwithai}
      POSTGRES_USER: ${PGUSER:-erdwithai}
      POSTGRES_PASSWORD: ${PGPASSWORD:-erdwithai}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      # Postgres 18 wants one mount at /var/lib/postgresql and puts its data in a

      # subdirectory; mounting the old /data path directly makes the image refuse

      # to start.

      - generator_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-erdwithai}"]
      interval: 5s
      timeout: 5s
      retries: 20

  generator:
    build:
      context: .
      dockerfile: Dockerfile
    image: erdwithai-generator:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${GENERATOR_PORT:-3000}:3000"
    environment:
      # Falls back to the bundled Postgres. Set DATABASE_URL to point anywhere.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${PGUSER:-erdwithai}:${PGPASSWORD:-erdwithai}@postgres:5432/${PGDATABASE:-erdwithai}}
      # Whichever of these is set decides where the starting model comes from.
      SEED_MODEL: ${SEED_MODEL:-}
      SEED_DATABASE_URL: ${SEED_DATABASE_URL:-}
      SEED_PROJECT_NAME: ${SEED_PROJECT_NAME:-}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-admin@erdwithai.local}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-erdwithai}
      VITE_APP_URL: ${VITE_APP_URL:-http://localhost:${GENERATOR_PORT:-3000}}
      LOCAL_AI_BASE_URL: ${LOCAL_AI_BASE_URL:-http://host.docker.internal:8000/v1}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-qwen3.6:27b-mlx}
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:-}
    volumes:
      # Models to import, read-only — the container has no business editing them.
      - ./examples:/models:ro
      # Generated applications outlive the container that wrote them.
      - generated_projects:/app/generated-projects
      # How the deploy step builds an image: the host's daemon, not one of ours.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
        required: false

volumes:
  generator_db:
  generated_projects:
