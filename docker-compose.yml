# The generator, with a database.
#
#   docker compose up --build                 local Postgres, empty workspace
#   SEED_MODEL=/models/drug-discovery.eml.mmd docker compose up --build
#
# To use a hosted database instead of the bundled one — Neon, Supabase, RDS —
# set DATABASE_URL and leave the postgres service out:
#
#   DATABASE_URL='postgresql://…@….neon.tech/db?sslmode=require' \
#     docker compose up generator
#
# The `postgres` service is in a profile precisely so that works: it starts by
# default, but naming the generator alone skips it.

services:
  postgres:
    image: pgvector/pgvector:pg18
    profiles: ["", "local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-appwithai}
      POSTGRES_USER: ${PGUSER:-appwithai}
      POSTGRES_PASSWORD: ${PGPASSWORD:-appwithai}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      # Postgres 18 wants one mount at /var/lib/postgresql and puts its data in a

      # subdirectory; mounting the old /data path directly makes the image refuse

      # to start.

      - generator_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-appwithai}"]
      interval: 5s
      timeout: 5s
      retries: 20

  generator:
    build:
      context: .
      dockerfile: Dockerfile
    image: appwithai-generator:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${GENERATOR_PORT:-3000}:3000"
    environment:
      # Falls back to the bundled Postgres. Set DATABASE_URL to point anywhere.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${PGUSER:-appwithai}:${PGPASSWORD:-appwithai}@postgres:5432/${PGDATABASE:-appwithai}}
      # Whichever of these is set decides where the starting model comes from.
      SEED_MODEL: ${SEED_MODEL:-}
      SEED_DATABASE_URL: ${SEED_DATABASE_URL:-}
      SEED_PROJECT_NAME: ${SEED_PROJECT_NAME:-}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-admin@appwithai.local}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-appwithai}
      VITE_APP_URL: ${VITE_APP_URL:-http://localhost:${GENERATOR_PORT:-3000}}
      LOCAL_AI_BASE_URL: ${LOCAL_AI_BASE_URL:-http://host.docker.internal:8000/v1}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-qwen3.6:27b-mlx}
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:-}
      # The deploy step shells out to `docker build` on the host's daemon, which
      # inherits nothing from this container. Behind a proxy that build needs the
      # same CA and network this process uses, or every dependency it tries to
      # fetch fails to resolve.
      DEPLOY_EXTRA_CA_CERT: ${DEPLOY_EXTRA_CA_CERT:-}
      DEPLOY_BUILD_NETWORK: ${DEPLOY_BUILD_NETWORK:-}
      # Forwarded to that build as build args. Empty on a normal network.
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    volumes:
      # Your own models, read-only — the container has no business editing them.
      # These appear in the import dialog's dropdown alongside the examples the
      # image already carries, and are listed first so yours win a name clash.
      - ./examples:/models:ro
      # Generated applications outlive the container that wrote them.
      - generated_projects:/app/generated-projects
      # How the deploy step builds an image: the host's daemon, not one of ours.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
        required: false

volumes:
  generator_db:
  generated_projects:
